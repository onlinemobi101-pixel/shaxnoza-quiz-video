# Render Blueprint — https://render.com/docs/blueprint-spec
# Bu faylni repo ildizida qoldirsangiz, Render "New > Blueprint" orqali avtomatik o'qiydi.
#
# sync: false bo'lgan qiymatlarni Render dashboardida qo'lda kiritasiz:
#   GCP_SERVICE_ACCOUNT_JSON      — Vertex AI service account (matn + TTS modellari)
#   FIREBASE_SERVICE_ACCOUNT_JSON — Firebase Admin (token tekshirish, kvota tranzaksiyalari)
# Ikkalasi ham bitta qatorli JSON sifatida saqlanadi. Batafsil: .env.example
services:
  - type: web
    name: quiz-video-generator
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: GCP_SERVICE_ACCOUNT_JSON
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      # Render'da Vercel'dagi 60s funksiya chegarasi yo'q, shuning uchun ttsBatch
      # uzunroq ishlashi va bitta so'rovda ko'proq klip yetkazishi mumkin.
      - key: TTS_BATCH_BUDGET_MS
        value: "120000"
