# Render Blueprint — https://render.com/docs/blueprint-spec
# Bu faylni repo ildizida qoldirsangiz, Render "New > Blueprint" orqali avtomatik o'qiydi.
# GEMINI_API_KEY va FIREBASE_SERVICE_ACCOUNT_JSON ni Render dashboardida qo'lda kiritasiz (sync: false).
services:
  - type: web
    name: quiz-video-generator
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: GEMINI_API_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
